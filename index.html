<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rayhan Study Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="eyebrow">YOUR PERSONAL LEARNING PARTNER</p>
      <h1>Rayhan Study Buddy</h1>
      <p>Ask a question, get a simple explanation, summary, or quick quiz .</p>
      <img class="flag" src="https://flagcdn.com/w160/pk.png" alt="Pakistan flag">
    </section>

    <section class="card">
      <label for="question">What would you like to study?</label>
      <textarea id="question" rows="7" placeholder="For example: Explain photosynthesis in simple words."></textarea>

      <p class="label">Choose what you need</p>
      <div class="modes" role="group" aria-label="Study mode">
        <button class="mode active" data-mode="explain" type="button">Explain</button>
        <button class="mode" data-mode="summarize" type="button">Summarize</button>
        <button id="urduButton" class="mode" type="button">Urdu answer</button>
        <button id="speakBtn" type="button" style="display: none;">🔊 Listen Answer</button>
        <button id="copyBtn" type="button" style="display: none; margin-left: 8px; background-color: #ffffff; color: #064e3b; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer;">📋 Copy Answer</button>
      </div>

      <button id="askButton" class="ask" type="button">Ask AI <span>→</span></button>
      <div style="margin-top: 20px;">
  <button id="speakBtn" type="button" style="background-color: #ffffff; color: #064e3b; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer;">🔊 Listen Answer</button>
  <div id="answer" style="margin-top: 15px; color: #ffffff; font-size: 1.1rem; line-height: 1.6;"></div>
</div>
    
    </section>

    <section id="answerCard" class="answer-card" hidden aria-live="polite">
      <p class="label">Study helper's answer</p>
      <div id="answer"></div>
      <button id="speakBtn" type="button" style="display: none; margin-top: 10px; background-color: #2e7d32; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer;">🔊 Listen Answer</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>

<style>
.hero { position: relative; } .flag { position: absolute; top: -18px; right: -85px; font-size: 4rem; filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.35)); transform-origin: left center; animation: flagWave 2s ease-in-out infinite; } @keyframes flagWave { 0%, 100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(8deg) translateY(-8px); } } @media (max-width: 700px) { .flag { position: relative; top: 0; right: 0; margin-top: 12px; } }
</style>
}
